<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Sepeti Hesaplayıcı</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container py-4" style="max-width: 750px;">

    <div class="total-box p-4 mb-4 d-flex flex-wrap justify-content-between align-items-start gap-3 shadow-sm">
      <div>
        <h4 class="mb-1 fw-bold"><i class="bi bi-cart4 me-2"></i>Market Sepetim</h4>
        <small class="opacity-75" id="itemCountText"></small>
      </div>
      <div class="text-start text-sm-end">
        <span class="d-block small opacity-75">Genel Toplam</span>
        <h2 class="mb-0 fw-bold text-nowrap" id="grandTotal">0,00 ₺</h2>
      </div>
    </div>

    <div class="card p-3 p-md-4 mb-4">
      <form id="productForm" class="row g-2 align-items-end">
        <div class="col-12 col-md-5">
          <label for="productName" class="form-label small fw-semibold text-muted">Ürün Adı</label>
          <input type="text" class="form-control" id="productName" placeholder="Örn: Süt, Yumurta..." required>
        </div>
        <div class="col-6 col-md-3">
          <label for="productPrice" class="form-label small fw-semibold text-muted">Birim Fiyat (₺)</label>
          <input type="number" step="0.01" min="0" class="form-control" id="productPrice" placeholder="0.00" required>
        </div>
        <div class="col-6 col-md-2">
          <label for="productQty" class="form-label small fw-semibold text-muted">Adet</label>
          <input type="number" min="1" class="form-control" id="productQty" placeholder="1">
        </div>
        <div class="col-12 col-md-2 d-grid">
          <button type="submit" class="btn btn-primary fw-semibold">
            <i class="bi bi-plus-lg"></i> Ekle
          </button>
        </div>
      </form>
    </div>

    <div class="card p-3 p-md-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="mb-0 fw-bold text-secondary">Alışveriş Listesi</h6>
        <button id="clearAllBtn" class="btn btn-outline-danger btn-sm" style="display: none;">
          <i class="bi bi-trash3 me-1"></i>Listeyi Temizle
        </button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" style="min-width: 480px;">
          <thead class="table-light">
            <tr>
              <th>Ürün</th>
              <th class="text-end text-nowrap">Birim Fiyat</th>
              <th class="text-center text-nowrap">Adet</th>
              <th class="text-end text-nowrap">Ara Toplam</th>
              <th class="text-center" style="width: 50px;">Sil</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
          </tbody>
        </table>
      </div>
      <div id="emptyState" class="text-center py-4 text-muted">
        <i class="bi bi-basket fs-1 d-block mb-2 opacity-50"></i>
        <p class="mb-0">Sepetiniz şu an boş. Yukarıdan ürün ekleyerek başlayabilirsiniz.</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
